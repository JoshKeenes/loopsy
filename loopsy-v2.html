<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Loopsy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
            background: hsl(240, 35%, 20%);
        }
        
        #root {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .icon-button {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 22px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        
        .icon-button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .home-button {
            right: 20px;
        }
        
        .tool-button {
            left: 20px;
        }
        
        .home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(180deg, hsl(240, 35%, 20%) 0%, hsl(260, 40%, 15%) 100%);
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        
        .home-screen.fading-out {
            opacity: 0;
            transform: scale(0.95);
        }
        
        .loopsly-logo {
            width: 180px;
            height: auto;
            margin-bottom: 25px;
            animation: gentleFloat 4s ease-in-out infinite;
        }
        
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .eye-wink {
            animation: wink 6s ease-in-out infinite;
            transform-origin: center;
        }
        
        @keyframes wink {
            0%, 48%, 52%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        
        .app-title {
            font-size: 42px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 100px;
            opacity: 0.9;
        }
        
        .swipe-hint {
            position: absolute;
            bottom: calc(50px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInOut 3s ease-in-out infinite;
            text-align: center;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }
        
        .swipe-icon {
            font-size: 24px;
            display: block;
            text-align: center;
            margin-bottom: 8px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .activities-screen {
            background: linear-gradient(180deg, hsl(240, 35%, 20%) 0%, hsl(260, 40%, 15%) 100%);
            padding: calc(80px + env(safe-area-inset-top)) 25px calc(30px + env(safe-area-inset-bottom));
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        
        .activities-screen.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }
        
        .activities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .activity-card {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 110px;
        }
        
        .activity-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .activity-icon {
            width: 40px;
            height: 40px;
            opacity: 0.75;
            margin-bottom: 5px;
        }
        
        .activity-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        
        /* ── Soft Tile Stack (v2 dashboard) ── */

        .activities-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .activity-tile {
            width: 100%;
            background: rgba(255, 255, 255, 0.065);
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 18px;
            padding: 13px 16px 13px 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.14s ease, background 0.14s ease;
            backdrop-filter: blur(10px);
            -webkit-tap-highlight-color: transparent;
            text-align: left;
        }

        .activity-tile:active {
            transform: scale(0.983);
            background: rgba(255, 255, 255, 0.1);
        }

        .tile-icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--tile-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tile-label {
            flex: 1;
            font-size: 19px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.2px;
        }

        .tile-chevron {
            color: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        .breathing-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25), rgba(200, 180, 255, 0.15));
            backdrop-filter: blur(5px);
        }
        
        .bubble {
            position: absolute;
            border-radius: 50%;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: inset -5px -5px 15px rgba(255, 255, 255, 0.3);
        }
        
        .bubble:active {
            transform: scale(0.7);
            opacity: 0;
        }
        
        .marble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.2),
                inset 10px 10px 20px rgba(255, 255, 255, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .lava-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            transition: none;
        }

        /* ── Loopsy character system ── */

        .loopsly-logo.sleeping .eye-wink {
            transform: scaleY(0.08);
            animation: none;
            transform-origin: center;
        }

        .loopsly-logo.sleeping {
            animation: sleepBreathe 5s ease-in-out infinite !important;
        }

        @keyframes sleepBreathe {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }

        .loopsy-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(64px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            display: flex;
            align-items: center;
            padding-left: 76px;
            padding-right: 76px;
            z-index: 10;
            pointer-events: none;
        }

        .loopsy-avatar-btn {
            position: absolute;
            left: 16px;
            top: calc(10px + env(safe-area-inset-top));
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            padding: 0;
            pointer-events: all;
        }

        .loopsy-avatar-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
        }

        .loopsy-progress-track {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 2px;
            overflow: hidden;
        }

        .loopsy-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(180, 160, 220, 0.45), rgba(210, 190, 245, 0.65));
            border-radius: 2px;
            transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .character-screen-overlay {
            position: fixed;
            inset: 0;
            background: rgba(22, 18, 45, 0.93);
            backdrop-filter: blur(24px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .character-screen-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .character-close-btn {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 22px;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .character-close-btn:active {
            transform: scale(0.92);
        }

        .speech-bubble {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px 28px;
            max-width: 260px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.3px;
            line-height: 1.55;
        }

        .character-float {
            animation: characterFloat 4.5s ease-in-out infinite;
        }

        @keyframes characterFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .exit-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, hsl(250, 42%, 13%) 0%, hsl(262, 48%, 9%) 100%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 44px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: all;
        }

        .exit-overlay.visible {
            opacity: 1;
        }

        .exit-progress-track {
            width: 160px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .exit-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(180, 160, 220, 0.6), rgba(210, 190, 245, 0.9));
            border-radius: 2px;
            transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loopsy-morph-wrap {
            transition: transform 0.9s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.6s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        
        // Haptic Settings Context
        const HapticContext = createContext({ enabled: true, setEnabled: () => {} });
        
        // Single, consistent haptic helper - always 12ms, light impact
        const haptic = () => {
            // Check if haptics are enabled (could be toggled via settings in future)
            const hapticsEnabled = true; // Can be made dynamic via context
            
            if (!hapticsEnabled) return;
            
            if (navigator.vibrate) {
                // Android/web - consistent 12ms vibration
                navigator.vibrate(12);
            } else if (window.webkit?.messageHandlers?.haptic) {
                // iOS if using native wrapper - use light impact
                window.webkit.messageHandlers.haptic.postMessage({ style: 'light' });
            }
        };
        
        // Loopsly Logo with winking animation
        function LoopslyLogo({ sleeping = false }) {
            return (
                <svg className={`loopsly-logo${sleeping ? ' sleeping' : ''}`} viewBox="0 0 852 1290" xmlns="http://www.w3.org/2000/svg">
                    <path d="M416.1,356.16c-31.812,2.754 -135.162,48.338 -165.221,66.504c-229.35,138.629 -276.458,659.408 -0.258,771.837c198.958,80.983 469.346,25.046 522.346,-209.104c47.483,-209.8 -11.338,-501.429 -228.325,-592.959c-22.196,-9.367 -108.767,-37.992 -128.542,-36.279Zm-6.975,-74.046c53.737,-20.496 161.25,-148.917 111.475,-202.979c-29.871,-32.446 -79.787,2.004 -101.425,28.171c-42.263,51.117 -39.654,118.192 -10.05,174.808Zm115.991,-9.804c-12.442,13.104 -28.125,25.571 -42.875,36.208c54.258,18.221 105.708,33.613 154.083,65.396c264.979,174.092 318.721,757.35 -27.108,882.617c-238.692,86.462 -525.471,6.329 -590.854,-260.592c-65.288,-266.542 42.646,-618.779 337.858,-685.421c2.7,-3.616 -15.129,-25.775 -18.2,-32.546c-60.546,-133.383 72.137,-333.858 210.533,-263.366c106.117,54.05 36.579,194.475 -23.438,257.704Z" fill="#8b80bc"/>
                    <path d="M302.32,807.14c25.046,-5.158 32.204,15.934 47.909,27.638c39.846,29.696 87.583,38.754 133.525,15.854c23.871,-11.9 54.525,-67.513 81.65,-35.946c32.067,37.317 -40.983,84.354 -71.042,95.325c-62.954,22.979 -151.346,8.716 -197.146,-42.542c-16.142,-18.066 -24.096,-54.312 5.104,-60.329Z" fill="#8b80bc"/>
                    <path className="eye-wink" d="M590.658,736.048c-8.204,8.967 -24.942,12 -36.471,8.554c-32.042,-9.567 -35.367,-98.287 8.217,-104.025c42.446,-5.583 47.917,73.992 28.254,95.471Z" fill="#8b80bc"/>
                    <path className="eye-wink" d="M286.067,640.402c53.487,-9.787 55.762,130.525 -10.113,101.979c-28.092,-12.175 -29.175,-94.787 10.113,-101.979Z" fill="#8b80bc"/>
                </svg>
            );
        }
        
        // Home Screen
        function HomeScreen({ onSwipeUp, isVisible }) {
            const [touchStart, setTouchStart] = useState(0);
            
            const handleTouchStart = (e) => {
                setTouchStart(e.touches[0].clientY);
                haptic();
            };
            
            const handleTouchEnd = (e) => {
                const touchEnd = e.changedTouches[0].clientY;
                const diff = touchStart - touchEnd;
                
                if (diff > 50) {
                    haptic();
                    onSwipeUp();
                }
            };
            
            return (
                <div 
                    className={`screen home-screen ${!isVisible ? 'fading-out' : ''}`}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                    style={{ pointerEvents: isVisible ? 'all' : 'none' }}
                >
                    <LoopslyLogo sleeping={true} />
                    <div className="app-title">loopsly</div>
                    <div className="swipe-hint">
                        <span className="swipe-icon">↑</span>
                        swipe up
                    </div>
                </div>
            );
        }
        
        // Icon components
        const DrawIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1.5">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                <path d="M2 2l7.586 7.586"/>
                <circle cx="11" cy="11" r="2"/>
            </svg>
        );
        
        const BreathIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1.5">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6" opacity="0.5"/>
                <circle cx="12" cy="12" r="2" opacity="0.3"/>
            </svg>
        );
        
        const FloatIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1.5">
                <circle cx="12" cy="12" r="3"/>
                <circle cx="18" cy="7" r="2" opacity="0.7"/>
                <circle cx="6" cy="16" r="2.5" opacity="0.8"/>
                <circle cx="16" cy="18" r="1.5" opacity="0.6"/>
            </svg>
        );
        
        const ShiftIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1.5">
                <path d="M12 2L2 7l10 5 10-5-10-5z" opacity="0.8"/>
                <path d="M2 17l10 5 10-5" opacity="0.6"/>
                <path d="M2 12l10 5 10-5" opacity="0.4"/>
            </svg>
        );
        
        const TapIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1.5">
                <circle cx="12" cy="5" r="2"/>
                <circle cx="5" cy="12" r="2"/>
                <circle cx="19" cy="12" r="2"/>
                <circle cx="8" cy="18" r="2"/>
                <circle cx="16" cy="18" r="2"/>
            </svg>
        );
        
        const FlowIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1.5">
                <ellipse cx="12" cy="8" rx="8" ry="4" opacity="0.7"/>
                <ellipse cx="12" cy="16" rx="6" ry="3" opacity="0.5"/>
                <ellipse cx="12" cy="12" rx="7" ry="3.5" opacity="0.6"/>
            </svg>
        );
        
        // Single activity tile
        function ActivityTile({ activity, onSelect }) {
            const handleClick = () => {
                haptic();
                onSelect(activity.id);
            };

            return (
                <button
                    className="activity-tile"
                    style={{ '--tile-tint': activity.tint }}
                    onClick={handleClick}
                >
                    <div className="tile-icon-wrap">
                        <activity.icon />
                    </div>
                    <span className="tile-label">{activity.label}</span>
                    <svg className="tile-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            );
        }

        // Activities Dashboard — Soft Tile Stack
        function ActivitiesScreen({ onSelectActivity, onHome, isVisible, loopsyState, onLoopsyClick }) {
            // Each activity gets a subtle tint for its icon background
            const activities = [
                { id: 'draw',   icon: DrawIcon,   label: 'Draw',    tint: 'rgba(175, 155, 220, 0.28)' },
                { id: 'breath', icon: BreathIcon, label: 'Breathe', tint: 'rgba(135, 185, 230, 0.28)' },
                { id: 'float',  icon: FloatIcon,  label: 'Float',   tint: 'rgba(130, 215, 195, 0.28)' },
                { id: 'shift',  icon: ShiftIcon,  label: 'Shift',   tint: 'rgba(225, 195, 135, 0.28)' },
                { id: 'tap',    icon: TapIcon,    label: 'Tap',     tint: 'rgba(225, 160, 165, 0.28)' },
                { id: 'flow',   icon: FlowIcon,   label: 'Flow',    tint: 'rgba(185, 160, 230, 0.28)' },
            ];

            const handleHomeClick = () => {
                haptic();
                onHome();
            };

            return (
                <div className={`screen activities-screen ${isVisible ? 'visible' : ''}`}>
                    <LoopsyTopBar loopsyState={loopsyState} onAvatarClick={onLoopsyClick} />
                    <button className="icon-button home-button" onClick={handleHomeClick}>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <div className="activities-stack">
                        {activities.map(activity => (
                            <ActivityTile
                                key={activity.id}
                                activity={activity}
                                onSelect={onSelectActivity}
                            />
                        ))}
                    </div>
                </div>
            );
        }
        
        // Activity: Draw
        function DrawActivity({ onHome }) {
            const canvasRef = useRef(null);
            const [isEraser, setIsEraser] = useState(false);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                ctx.fillStyle = 'hsl(240, 35%, 20%)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }, []);
            
            const handleTouch = (e) => {
                if (e.target.closest('.icon-button')) return;
                haptic();
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
                const y = e.touches ? e.touches[0].clientY - rect.top : e.clientY - rect.top;
                
                if (isEraser) {
                    ctx.fillStyle = 'hsl(240, 35%, 20%)';
                    ctx.beginPath();
                    ctx.arc(x, y, 30, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const hue = Math.random() * 80 + 200;
                    const saturation = 50 + Math.random() * 20;
                    const lightness = 50 + Math.random() * 20;
                    
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, 60);
                    gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, 0.35)`);
                    gradient.addColorStop(0.5, `hsla(${hue}, ${saturation}%, ${lightness}%, 0.18)`);
                    gradient.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness}%, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Activity: Shift
        function ShiftActivity({ onHome }) {
            const canvasRef = useRef(null);
            const particles = useRef([]);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                for (let i = 0; i < 800; i++) {
                    particles.current.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: 0,
                        vy: 0,
                        hue: 200 + Math.random() * 60
                    });
                }
                
                function animate() {
                    ctx.fillStyle = 'rgba(30, 30, 50, 0.1)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    particles.current.forEach(p => {
                        p.vx *= 0.95;
                        p.vy *= 0.95;
                        p.x += p.vx;
                        p.y += p.vy;
                        
                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;
                        
                        ctx.fillStyle = `hsla(${p.hue}, 60%, 60%, 0.6)`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    
                    requestAnimationFrame(animate);
                }
                
                animate();
            }, []);
            
            const handleTouch = (e) => {
                if (e.target.closest('.icon-button')) return;
                haptic();
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
                const y = e.touches ? e.touches[0].clientY - rect.top : e.clientY - rect.top;
                
                particles.current.forEach(p => {
                    const dx = p.x - x;
                    const dy = p.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const force = (100 - dist) / 100;
                        p.vx += dx / dist * force * 3;
                        p.vy += dy / dist * force * 3;
                    }
                });
            };
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, hsl(240, 35%, 20%) 0%, hsl(260, 40%, 15%) 100%)' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick}>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>

                    <canvas 
                        ref={canvasRef}
                        onTouchStart={handleTouch}
                        onTouchMove={handleTouch}
                        onMouseDown={handleTouch}
                        onMouseMove={(e) => e.buttons === 1 && handleTouch(e)}
                    />
                </div>
            );

        // Activity: Flow (Lava Lamp with Gyroscope)
        function FlowActivity({ onHome }) {
            const [blobs, setBlobs] = useState([]);
            const gyroData = useRef({ beta: 0, gamma: 0 });
            const smoothedGyro = useRef({ beta: 0, gamma: 0 });
            
            useEffect(() => {
                // Initialize blobs
                const initialBlobs = [
                    { id: 1, x: 30, y: 40, vx: 0, vy: 0, size: 180, color: 'rgba(200, 150, 255, 0.6)' },
                    { id: 2, x: 60, y: 70, vx: 0, vy: 0, size: 220, color: 'rgba(150, 200, 255, 0.6)' },
                    { id: 3, x: 20, y: 20, vx: 0, vy: 0, size: 160, color: 'rgba(255, 180, 200, 0.6)' },
                    { id: 4, x: 70, y: 50, vx: 0, vy: 0, size: 200, color: 'rgba(180, 255, 220, 0.6)' }
                ];
                setBlobs(initialBlobs);
                
                // Request device orientation permission (iOS 13+)
                const requestPermission = async () => {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        try {
                            const permission = await DeviceOrientationEvent.requestPermission();
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        } catch (error) {
                            console.log('Device orientation not available');
                        }
                    } else {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                };
                
                const handleOrientation = (event) => {
                    gyroData.current = {
                        beta: event.beta || 0,   // front-back tilt (-180 to 180)
                        gamma: event.gamma || 0  // left-right tilt (-90 to 90)
                    };
                };
                
                requestPermission();
                
                // Animation loop
                const interval = setInterval(() => {
                    // Smooth gyroscope data (remove jitter)
                    smoothedGyro.current.beta += (gyroData.current.beta - smoothedGyro.current.beta) * 0.05;
                    smoothedGyro.current.gamma += (gyroData.current.gamma - smoothedGyro.current.gamma) * 0.05;
                    
                    // Convert tilt to gentle force (very small multiplier for slow movement)
                    const forceX = smoothedGyro.current.gamma * 0.002;
                    const forceY = smoothedGyro.current.beta * 0.002;
                    
                    setBlobs(prev => prev.map(blob => {
                        // Apply force from gyroscope
                        let newVx = blob.vx + forceX;
                        let newVy = blob.vy + forceY;
                        
                        // Heavy damping (like honey)
                        newVx *= 0.92;
                        newVy *= 0.92;
                        
                        // Update position
                        let newX = blob.x + newVx;
                        let newY = blob.y + newVy;
                        
                        // Soft boundaries (bounce gently)
                        if (newX < 5) {
                            newX = 5;
                            newVx *= -0.3;
                        }
                        if (newX > 95) {
                            newX = 95;
                            newVx *= -0.3;
                        }
                        if (newY < 5) {
                            newY = 5;
                            newVy *= -0.3;
                        }
                        if (newY > 95) {
                            newY = 95;
                            newVy *= -0.3;
                        }
                        
                        return {
                            ...blob,
                            x: newX,
                            y: newY,
                            vx: newVx,
                            vy: newVy
                        };
                    }));
                }, 50); // 20fps for smooth but not too fast movement
                
                return () => {
                    clearInterval(interval);
                    window.removeEventListener('deviceorientation', handleOrientation);
                };
            }, []);
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, hsl(240, 35%, 20%) 0%, hsl(260, 40%, 15%) 100%)', overflow: 'hidden' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick}>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    {blobs.map(blob => (
                        <div
                            key={blob.id}
                            className="lava-blob"
                            style={{
                                left: `${blob.x}%`,
                                top: `${blob.y}%`,
                                width: `${blob.size}px`,
                                height: `${blob.size}px`,
                                background: blob.color,
                                transform: 'translate(-50%, -50%)'
                            }}
                        />
                    ))}
                </div>
            );
        }
        
        // ── Loopsy character system ──

        const LOOPSY_PHRASES = [
            "you're okay here",
            "we can stay a while",
            "nothing needed",
            "just being is enough",
            "this is a gentle place",
            "no rush at all",
            "you belong here",
            "soft and still",
            "breathe easy",
            "all is well here",
            "there's nowhere to be",
            "rest here a moment"
        ];

        // stage 0 = tiny seed, 4 = full character
        function LoopsyCharacterSVG({ stage = 0, size = 80, sleeping = false }) {
            const bodyColor = '#c0b8e0';
            const featureColor = '#7a6faa';

            const cfg = [
                { rx: 18, ry: 14, cy: 58 },
                { rx: 22, ry: 18, cy: 55 },
                { rx: 26, ry: 22, cy: 52 },
                { rx: 29, ry: 25, cy: 50 },
                { rx: 32, ry: 27, cy: 48 },
            ][stage];

            const { rx, ry, cy } = cfg;
            const cx = 40;
            const eyeY = cy - ry * 0.28;
            const eyeGap = rx * 0.44;

            return (
                <svg width={size} height={size} viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" style={{ overflow: 'visible' }}>
                    {stage >= 3 && (
                        <>
                            <ellipse cx={cx - rx - 6} cy={cy + 2} rx={8} ry={4.5}
                                fill={bodyColor} transform={`rotate(-22 ${cx - rx - 6} ${cy + 2})`} />
                            <ellipse cx={cx + rx + 6} cy={cy + 2} rx={8} ry={4.5}
                                fill={bodyColor} transform={`rotate(22 ${cx + rx + 6} ${cy + 2})`} />
                        </>
                    )}
                    <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill={bodyColor} />
                    {stage >= 4 && (
                        <>
                            <ellipse cx={cx - 11} cy={cy + ry + 5} rx={9} ry={5} fill={bodyColor} />
                            <ellipse cx={cx + 11} cy={cy + ry + 5} rx={9} ry={5} fill={bodyColor} />
                        </>
                    )}
                    {sleeping ? (
                        <>
                            <line x1={cx - eyeGap - 5} y1={eyeY} x2={cx - eyeGap + 5} y2={eyeY}
                                stroke={featureColor} strokeWidth="2.5" strokeLinecap="round" />
                            <line x1={cx + eyeGap - 5} y1={eyeY} x2={cx + eyeGap + 5} y2={eyeY}
                                stroke={featureColor} strokeWidth="2.5" strokeLinecap="round" />
                            <text x={cx + rx - 2} y={cy - ry - 4}
                                fill="rgba(180,170,220,0.5)" fontSize="12" fontWeight="200"
                                fontFamily="-apple-system, sans-serif">z</text>
                        </>
                    ) : stage > 0 ? (
                        <>
                            <circle cx={cx - eyeGap} cy={eyeY} r={stage >= 3 ? 2.8 : 2.2} fill={featureColor} />
                            <circle cx={cx + eyeGap} cy={eyeY} r={stage >= 3 ? 2.8 : 2.2} fill={featureColor} />
                        </>
                    ) : null}
                    {!sleeping && stage >= 2 && (
                        <path
                            d={`M ${cx - 9} ${cy + ry * 0.32} Q ${cx} ${cy + ry * 0.62} ${cx + 9} ${cy + ry * 0.32}`}
                            stroke={featureColor} strokeWidth="2" strokeLinecap="round" fill="none"
                        />
                    )}
                </svg>
            );
        }

        function stageFromCount(n) { return Math.min(4, Math.floor(n / 2)); }
        function progressFromCount(n) { return Math.min(1, n / 8); }

        function LoopsyTopBar({ loopsyState, onAvatarClick }) {
            const progress = progressFromCount(loopsyState.activityCount);
            return (
                <div className="loopsy-top-bar">

        function CharacterScreen({ loopsyState, onClose }) {
            const [visible, setVisible] = useState(false);
            const [phrase] = useState(
                () => LOOPSY_PHRASES[Math.floor(Math.random() * LOOPSY_PHRASES.length)]

        }

        function ExitOverlay({ loopsyState, pendingState, onComplete }) {
            const [visible, setVisible] = useState(false);
            const [fillWidth, setFillWidth] = useState(progressFromCount(loopsyState.activityCount) * 100);
            const [showNext, setShowNext] = useState(false);
            const stageChanged = pendingState.stage > loopsyState.stage;

            useEffect(() => {
                requestAnimationFrame(() => setVisible(true));

                const t1 = setTimeout(() => {
                    setFillWidth(progressFromCount(pendingState.activityCount) * 100);
                }, 350);

                const t2 = stageChanged ? setTimeout(() => setShowNext(true), 1000) : null;

                const totalDuration = stageChanged ? 2200 : 1700;
                const t3 = setTimeout(() => {
                    setVisible(false);
                    setTimeout(onComplete, 420);
                }, totalDuration);

                return () => { clearTimeout(t1); if (t2) clearTimeout(t2); clearTimeout(t3); };
            }, []);

            const displayStage = showNext ? pendingState.stage : loopsyState.stage;

            return (
                <div className={`exit-overlay ${visible ? 'visible' : ''}`}>
                    <div className="loopsy-morph-wrap" style={{
                        transform: showNext ? 'scale(1.1)' : 'scale(1)',
                        opacity: 1
                    }}>
                        <LoopsyCharacterSVG stage={displayStage} size={130} />
                    </div>
                    <div className="exit-progress-track">
                        <div className="exit-progress-fill" style={{ width: `${fillWidth}%` }} />
                    </div>
                </div>
            );
        }

        // Main App
        function App() {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [showActivities, setShowActivities] = useState(false);
            const [showHome, setShowHome] = useState(true);
            const [currentActivity, setCurrentActivity] = useState(null);
            const [loopsyState, setLoopsyState] = useState({ stage: 0, activityCount: 0 });
            const [pendingLoopsyState, setPendingLoopsyState] = useState(null);
            const [showExitOverlay, setShowExitOverlay] = useState(false);
            const [showCharacterScreen, setShowCharacterScreen] = useState(false);

            const handleSwipeUp = () => {
                setShowHome(false);
                setTimeout(() => {
                    setShowActivities(true);
                    setCurrentScreen('activities');
                }, 600);
            };

            const handleHome = () => {
                if (currentActivity) {
                    const newCount = loopsyState.activityCount + 1;
                    const newStage = stageFromCount(newCount);
                    setPendingLoopsyState({ stage: newStage, activityCount: newCount });
                    setShowExitOverlay(true);
                } else if (currentScreen === 'activities') {
                    setShowActivities(false);
                    setTimeout(() => {
                        setShowHome(true);
                        setCurrentScreen('home');
                    }, 600);
                }
            };

            const handleExitComplete = () => {
                setLoopsyState(pendingLoopsyState);
                setCurrentActivity(null);
                setShowExitOverlay(false);
                setPendingLoopsyState(null);
            };

            const activities = {
                draw: <DrawActivity onHome={handleHome} />,
                breath: <BreathActivity onHome={handleHome} />,
                float: <FloatActivity onHome={handleHome} />,
                shift: <ShiftActivity onHome={handleHome} />,
                tap: <TapActivity onHome={handleHome} />,
                flow: <FlowActivity onHome={handleHome} />
            };

            return (
                <div id="app">
                    {showExitOverlay && pendingLoopsyState && (
                        <ExitOverlay
                            loopsyState={loopsyState}
                            pendingState={pendingLoopsyState}
                            onComplete={handleExitComplete}
                        />
                    )}
                    {showCharacterScreen && (
                        <CharacterScreen
                            loopsyState={loopsyState}
                            onClose={() => setShowCharacterScreen(false)}
                        />
                    )}
                    {currentActivity ? (
                        activities[currentActivity]
                    ) : (
                        <>
                            <HomeScreen onSwipeUp={handleSwipeUp} isVisible={showHome} />
                            <ActivitiesScreen
                                onSelectActivity={setCurrentActivity}
                                onHome={handleHome}
                                isVisible={showActivities}
                                loopsyState={loopsyState}
                                onLoopsyClick={() => { haptic(); setShowCharacterScreen(true); }}
                            />
                        </>
                    )}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
