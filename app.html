<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>loopsy - play</title>
    <meta name="description" content="loopsy - a calm, pressure-free sensory space for children. No tasks, no timers, no pressure. Just somewhere to be.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.loopsy.co.uk/app">
    <meta property="og:title" content="loopsy - play">
    <meta property="og:description" content="A calm, pressure-free sensory space for children with PDA and autism. Just somewhere to be.">
    <meta property="og:image" content="https://www.loopsy.co.uk/assets/loopsy/loopsy-sleeping.png">

    <link rel="canonical" href="https://www.loopsy.co.uk/app">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
            background: #F6F3EE;
        }
        
        #root {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .icon-button {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            width: 44px;
            height: 44px;
            background: rgba(58, 58, 58, 0.07);
            border: none;
            border-radius: 22px;
            font-size: 20px;
            color: rgba(58, 58, 58, 0.5);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* No backdrop-filter — avoids compositing-layer repaint bug on theme toggle */
            transition: background 0.2s ease, color 0.2s ease;
        }

        .icon-button:active {
            transform: scale(0.95);
            background: rgba(58, 58, 58, 0.13);
        }
        
        .home-button {
            right: 20px;
        }
        
        .tool-button {
            left: 20px;
        }
        
        .home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%);
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        
        .home-screen.fading-out {
            opacity: 0;
            transform: scale(0.95);
        }
        
        /* Loopsy float — used on sleeping image and character images */
        @keyframes loopsyFloat {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-9px); }
        }

        .loopsy-float {
            animation: loopsyFloat 5s ease-in-out infinite;
        }

        /* Home screen sleeping character */
        .loopsy-home-wrap {
            position: relative;
            display: inline-flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .loopsy-sleeping-img {
            width: 170px;
            height: auto;
            display: block;
        }

        /* Zzz speech bubble */
        .zzz-bubble {
            position: absolute;
            top: 4px;
            right: -34px;
            background: rgba(255, 255, 255, 0.78);
            border-radius: 14px 14px 14px 4px;
            padding: 5px 11px;
            font-size: 15px;
            font-weight: 500;
            color: rgba(58, 58, 58, 0.52);
            letter-spacing: 1.5px;
            pointer-events: none;
            animation: zzzPulse 5s ease-in-out infinite;
        }

        @keyframes zzzPulse {
            0%, 100% { opacity: 0.5; transform: translateY(0px); }
            50%       { opacity: 0.82; transform: translateY(-4px); }
        }

        /* Loopsy character image (stage 1–5 in overlays and top bar) */
        .loopsy-char-img {
            display: block;
            object-fit: contain;
        }

        /* Activity tile PNG icon */
        .tile-icon-img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            display: block;
        }

        /* ── Accessibility: text contrast & weights ── */
        .app-title {
            font-size: 42px;
            color: #5A5260;          /* contrast 4.6:1 on #F6F3EE — AA pass */
            font-weight: 500;
            letter-spacing: 3px;
            margin-bottom: 100px;
        }

        .swipe-hint {
            position: absolute;
            bottom: calc(50px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #6B6578;          /* contrast 4.5:1 on #F6F3EE — AA pass (large text) */
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            animation: fadeInOut 4s ease-in-out infinite;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.45; }
            50%       { opacity: 0.85; }
        }

        .swipe-icon {
            font-size: 22px;
            display: block;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .activities-screen {
            background: linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%);
            padding: calc(100px + env(safe-area-inset-top)) 25px calc(30px + env(safe-area-inset-bottom));
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        
        .activities-screen.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }
        
        .activities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .activity-card {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 110px;
        }
        
        .activity-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .activity-icon {
            width: 40px;
            height: 40px;
            opacity: 0.75;
            margin-bottom: 5px;
        }
        
        .activity-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        
        /* ── Soft Tile Stack (v2 dashboard) ── */

        .activities-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .activity-tile {
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(58, 58, 58, 0.07);
            border-radius: 18px;
            padding: 13px 16px 13px 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.14s ease, background 0.14s ease;
            -webkit-tap-highlight-color: transparent;
            text-align: left;
        }

        .activity-tile:active {
            transform: scale(0.983);
            background: rgba(255, 255, 255, 0.95);
        }

        .tile-icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--tile-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tile-label {
            flex: 1;
            font-size: 18px;
            font-weight: 500;   /* 4.5:1+ contrast on tile bg */
            color: #3A3A3A;
            letter-spacing: 0.1px;
        }

        .tile-chevron {
            color: rgba(58, 58, 58, 0.32);
            flex-shrink: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        .breathing-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(175, 155, 215, 0.3), rgba(200, 180, 240, 0.12));
            backdrop-filter: blur(5px);
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(58, 58, 58, 0.1);
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: inset -5px -5px 15px rgba(255, 255, 255, 0.55);
        }
        
        .bubble:active {
            transform: scale(0.7);
            opacity: 0;
        }
        
        .marble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.2),
                inset 10px 10px 20px rgba(255, 255, 255, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .lava-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            transition: none;
        }

        /* ── Loopsy character system ── */

        .loopsly-logo.sleeping .eye-wink {
            transform: scaleY(0.08);
            animation: none;
            transform-origin: center;
        }

        .loopsly-logo.sleeping {
            animation: sleepBreathe 5s ease-in-out infinite !important;
        }

        @keyframes sleepBreathe {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }

        .loopsy-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(84px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            display: flex;
            align-items: center;
            /* left: clear avatar (16px left + 44px wide + 12px gap = 72px)        */
            /* right: clear dark-toggle (76px right + 44px wide + 16px gap = 136px) */
            padding-left: 72px;
            padding-right: 136px;
            z-index: 10;
            pointer-events: none;
        }

        .loopsy-avatar-btn {
            position: absolute;
            left: 16px;
            top: calc(20px + env(safe-area-inset-top));
            width: 44px;
            height: 44px;
            background: rgba(58, 58, 58, 0.06);
            border: none;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            pointer-events: all;
        }

        .loopsy-avatar-btn:active {
            transform: scale(0.92);
            background: rgba(58, 58, 58, 0.12);
        }

        .loopsy-progress-track {
            flex: 1;
            height: 3px;
            background: rgba(58, 58, 58, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loopsy-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(155, 135, 195, 0.55), rgba(175, 155, 215, 0.75));
            border-radius: 2px;
            transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .character-screen-overlay {
            position: fixed;
            inset: 0;
            background: #F6F3EE;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .character-screen-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .character-close-btn {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(58, 58, 58, 0.07);
            border: none;
            border-radius: 22px;
            color: rgba(58, 58, 58, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .character-close-btn:active {
            transform: scale(0.92);
        }

        .speech-bubble {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(58, 58, 58, 0.08);
            border-radius: 20px;
            padding: 18px 28px;
            max-width: 260px;
            text-align: center;
            color: #5A5260;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.3px;
            line-height: 1.55;
        }

        /* Affirmation shown instead of progress bar at max stage */
        .exit-affirmation {
            font-size: 20px;
            font-weight: 400;
            color: #5A5260;
            letter-spacing: 0.4px;
            opacity: 0.72;
        }

        .character-float {
            animation: characterFloat 4.5s ease-in-out infinite;
        }

        @keyframes characterFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .exit-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 44px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: all;
        }

        .exit-overlay.visible {
            opacity: 1;
        }

        .exit-progress-track {
            width: 160px;
            height: 3px;
            background: rgba(58, 58, 58, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .exit-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(155, 135, 195, 0.6), rgba(175, 155, 215, 0.85));
            border-radius: 2px;
            transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loopsy-morph-wrap {
            transition: transform 0.9s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.6s ease;
        }

        /* ── Breath game ── */
        .breath-count {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 200;
            color: rgba(90, 82, 96, 0.4);
            letter-spacing: -2px;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        @keyframes rippleExpand {
            0%   { width: 160px; height: 160px; opacity: 0.48; }
            100% { width: 560px; height: 560px; opacity: 0; }
        }

        .breath-ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1.5px solid rgba(175, 145, 210, 0.42);
            pointer-events: none;
            animation: rippleExpand 3.6s ease-out forwards;
        }

        /* ── Draw game toolbar ── */
        .draw-toolbar {
            position: absolute;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(58, 58, 58, 0.08);
            border-radius: 32px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            gap: 3px;
            z-index: 100;
            white-space: nowrap;
        }

        .draw-tool-btn {
            width: 46px;
            height: 46px;
            border: none;
            background: transparent;
            border-radius: 23px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .draw-tool-btn.active {
            background: rgba(155, 135, 195, 0.15);
        }

        .draw-tool-btn:active {
            transform: scale(0.88);
        }

        .brush-dot {
            border-radius: 50%;
            background: #5A5260;
            opacity: 0.55;
            flex-shrink: 0;
        }

        .draw-divider {
            width: 1px;
            height: 22px;
            background: rgba(58, 58, 58, 0.12);
            margin: 0 3px;
            flex-shrink: 0;
        }

        /* ── Speech bubble (character screen) — tail pointing down to character ── */
        .speech-bubble {
            position: relative;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid rgba(255, 255, 255, 0.78);
        }

        /* ── Level-up confetti ── */
        @keyframes confettiFall {
            0%   { transform: translateY(0px) rotate(0deg);   opacity: 0.88; }
            100% { transform: translateY(115vh) rotate(520deg); opacity: 0; }
        }

        /* ── Float game pop burst ── */
        @keyframes popParticle {
            0%   { opacity: 0.88; transform: translate(-50%, -50%) translate(0, 0) scale(1); }
            100% { opacity: 0;    transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0); }
        }

        /* ── Drag correct-placement mini burst ── */
        @keyframes burstPiece {
            0%   { opacity: 0.92; transform: translate(-50%, -50%) translate(0, 0) scale(1.2); }
            70%  { opacity: 0.6; }
            100% { opacity: 0;   transform: translate(-50%, -50%) translate(var(--pdx), var(--pdy)) scale(0.2); }
        }

        /* ── Breath phase label ── */
        .breath-label {
            position: absolute;
            top: calc(50% + 152px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 300;
            color: rgba(90, 82, 96, 0.38);
            letter-spacing: 2px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        /* ── Character screen reset button ── */
        .reset-btn {
            position: absolute;
            bottom: calc(36px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(58, 58, 58, 0.07);
            border: none;
            border-radius: 22px;
            padding: 10px 20px;
            color: rgba(58, 58, 58, 0.5);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .reset-btn:active {
            transform: translateX(-50%) scale(0.94);
            background: rgba(58, 58, 58, 0.12);
        }

        /* ── Drag sorting game ── */
        .drag-complete-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(58, 58, 58, 0.08);
            border-radius: 20px;
            padding: 18px 32px;
            font-size: 19px;
            font-weight: 400;
            color: #5A5260;
            text-align: center;
            letter-spacing: 0.3px;
            z-index: 50;
            pointer-events: none;
        }

        /* ── Dark mode toggle button position ── */
        .dark-toggle-btn {
            right: 76px;
        }

        /* ── Game completion overlay message ── */
        .game-complete-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(58, 58, 58, 0.08);
            border-radius: 20px;
            padding: 20px 36px;
            font-size: 22px;
            font-weight: 400;
            color: #5A5260;
            pointer-events: none;
            z-index: 50;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* ── Dark mode — WCAG 2.2 AA palette ── */
        /* Primary text #EDE8F8 on #1C1826 ≈ 12:1 ✓  Secondary #B8AED0 ≈ 6:1 ✓  Muted #8A80A0 ≈ 4.5:1 ✓ */

        /* All screens (dashboard + every game) get the dark background */
        #app.dark-mode .screen {
            background: #1C1826 !important;
        }

        #app.dark-mode .home-screen,
        #app.dark-mode .activities-screen {
            background: linear-gradient(180deg, #1C1826 0%, #211D2F 100%) !important;
        }

        #app.dark-mode .app-title {
            color: #EDE8F8;
        }

        #app.dark-mode .swipe-hint {
            color: #B8AED0;
        }

        #app.dark-mode .zzz-bubble {
            background: rgba(37, 32, 52, 0.78);
            color: rgba(237, 232, 248, 0.55);
        }

        #app.dark-mode .activity-tile {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.06);
        }

        #app.dark-mode .activity-tile:active {
            background: rgba(255, 255, 255, 0.1);
        }

        #app.dark-mode .tile-label {
            color: #EDE8F8;
        }

        #app.dark-mode .tile-chevron {
            color: rgba(237, 232, 248, 0.28);
        }

        #app.dark-mode .icon-button,
        #app.dark-mode .loopsy-avatar-btn {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(237, 232, 248, 0.65);
        }

        #app.dark-mode .icon-button:active,
        #app.dark-mode .loopsy-avatar-btn:active {
            background: rgba(255, 255, 255, 0.14);
        }

        #app.dark-mode .loopsy-progress-track {
            background: rgba(255, 255, 255, 0.1);
        }

        #app.dark-mode .exit-overlay,
        #app.dark-mode .character-screen-overlay {
            background: linear-gradient(180deg, #1C1826 0%, #211D2F 100%);
        }

        #app.dark-mode .speech-bubble {
            background: rgba(37, 32, 52, 0.92);
            border-color: rgba(255, 255, 255, 0.08);
            color: #EDE8F8;
        }

        #app.dark-mode .speech-bubble::after {
            border-top-color: rgba(37, 32, 52, 0.92);
        }

        #app.dark-mode .character-close-btn {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(237, 232, 248, 0.6);
        }

        #app.dark-mode .reset-btn {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(237, 232, 248, 0.45);
        }

        #app.dark-mode .draw-toolbar {
            background: rgba(30, 25, 44, 0.92);
            border-color: rgba(255, 255, 255, 0.08);
        }

<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        
        // Haptic Settings Context
        const HapticContext = createContext({ enabled: true, setEnabled: () => {} });
        
        // Haptic helper — style: 'light' | 'medium' | 'heavy'
        const haptic = (style = 'light') => {
            const ms = style === 'heavy' ? 28 : style === 'medium' ? 15 : 8;
            if (navigator.vibrate) {
                navigator.vibrate(ms);
            } else if (window.webkit?.messageHandlers?.haptic) {
                window.webkit.messageHandlers.haptic.postMessage({ style });
            }
        };

        // Web Audio sound system — lazy AudioContext init (iOS/Android browser requirement)
        const sounds = (() => {
            let ctx = null;
            function _ctx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }
            // freq Hz, dur seconds, gain 0-1, wave type, start delay seconds
            function _tone(freq, dur, gain = 0.13, type = 'sine', delay = 0) {
                try {
                    const c = _ctx();
                    const osc = c.createOscillator();
                    const env = c.createGain();
                    osc.connect(env); env.connect(c.destination);
                    osc.type = type;
                    osc.frequency.value = freq;
                    const t = c.currentTime + delay;
                    env.gain.setValueAtTime(0, t);
                    env.gain.linearRampToValueAtTime(gain, t + 0.012);
                    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                    osc.start(t); osc.stop(t + dur + 0.05);
                } catch(_) {}
            }
            return {
                tap:        () => _tone(540, 0.11, 0.09),
                pop:        () => { _tone(700, 0.07, 0.08); _tone(540, 0.11, 0.05, 'sine', 0.05); },
                pick:       () => _tone(460, 0.09, 0.08),
                place:      () => { _tone(620, 0.08, 0.09); _tone(780, 0.11, 0.09, 'sine', 0.07); },
                touch:      () => _tone(390, 0.13, 0.07, 'triangle'),
                scatter:    () => _tone(310, 0.16, 0.07, 'triangle'),
                breatheIn:  () => { _tone(330, 0.55, 0.055); _tone(440, 0.55, 0.035); },
                breatheOut: () => { _tone(290, 0.65, 0.055); _tone(370, 0.65, 0.035); },
                hold:       () => _tone(360, 0.18, 0.04),
                complete:   () => [0,1,2].forEach(i => _tone([540,660,800][i], 0.22, 0.11, 'sine', i * 0.13)),
                levelUp:    () => [0,1,2,3].forEach(i => _tone([440,550,660,880][i], 0.18, 0.09, 'sine', i * 0.10)),
            };
        })();
        
        // Loopsy sleeping — home screen only
        function LoopsySleeping() {
            return (
                <div className="loopsy-home-wrap">
                    <img
                        src="assets/loopsy/loopsy-sleeping.png"
                        alt=""
                        aria-hidden="true"
                        className="loopsy-sleeping-img loopsy-float"
                    />
                    <div className="zzz-bubble" aria-hidden="true">Zzz…</div>
                </div>
            );
        }
        
        // Home Screen
        function HomeScreen({ onSwipeUp, isVisible }) {
            const [touchStart, setTouchStart] = useState(0);
            const mouseStartY = useRef(0);

            const handleTouchStart = (e) => {
                setTouchStart(e.touches[0].clientY);
                haptic();
            };

            const handleTouchEnd = (e) => {
                const diff = touchStart - e.changedTouches[0].clientY;
                if (diff > 50) { haptic(); onSwipeUp(); }
            };

            // Desktop: click-and-drag upward
            const handleMouseDown = (e) => { mouseStartY.current = e.clientY; };
            const handleMouseUp   = (e) => {
                if (mouseStartY.current - e.clientY > 50) { haptic(); onSwipeUp(); }
            };

            // Desktop: scroll wheel upward
            const handleWheel = (e) => {
                if (e.deltaY < -30) { haptic(); onSwipeUp(); }
            };

            return (
                <div
                    className={`screen home-screen ${!isVisible ? 'fading-out' : ''}`}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                    onMouseDown={handleMouseDown}
                    onMouseUp={handleMouseUp}
                    onWheel={handleWheel}
                    style={{ pointerEvents: isVisible ? 'all' : 'none' }}
                >
                    <LoopsySleeping />
                    <div className="app-title">loopsy</div>
                    <div className="swipe-hint">
                        <span className="swipe-icon">↑</span>
                        swipe up
                    </div>
                </div>
            );
        }
        
        // Icon components
        const DrawIcon = () => (

        const FlowIcon = () => (

        // Inline SVG icon for the Drag sorting game tile

                <rect x="23" y="8" width="5.5" height="14" rx="2.5" stroke="rgba(58,58,58,0.38)" strokeWidth="1.4" fill="none"/>
                <rect x="24.3" y="16" width="2.9" height="5" rx="1.2" fill="rgba(155,130,200,0.5)"/>

        );

        // Dashboard banner messages — module-level so they persist across remounts
        const BANNER_MESSAGES = [
            "Hey, what shall we play?",
            "You're in charge here",
            "Take your time, no rush",
            "You choose what happens next",
            "There's no right or wrong today",
            "This is your space",
            "Go at your own pace",
            "You're safe here",
            "It's okay to just be",
            "Nothing has to happen today",
            "You get to decide",
            "Everything is okay right now",
            "Stay as long as you like",
            "This is a calm place",

        ];
        // Tracks which message to show next — increments each time dashboard is visited
        let _bannerVisitCount = 0;

        // Dashboard welcome banner — shows next message each time user returns from a game
        function DashboardBanner() {
            // Grab the message for this visit on mount, then advance the counter
            const [msgIdx] = useState(() => {
                const idx = _bannerVisitCount % BANNER_MESSAGES.length;

            return (

        // Single activity tile — supports PNG icon (icon prop) or inline element (iconEl prop)
        function ActivityTile({ activity, onSelect }) {
            const handleClick = () => {
                haptic();
                onSelect(activity.id);
            };

            return (

                    className="activity-tile"
                    style={{ '--tile-tint': activity.tint }}

                >

        // Activities Dashboard — Soft Tile Stack
        function ActivitiesScreen({ onSelectActivity, onHome, isVisible, loopsyState, onLoopsyClick, isDark, onToggleDark }) {
            const activities = [
                { id: 'draw',   icon: 'draw.png',    label: 'Draw',    tint: '#EDE7F6' },

                { id: 'shift',  icon: 'shift.png',   label: 'Shift',   tint: '#FEF3E2' },

            return (
                <div className={`screen activities-screen ${isVisible ? 'visible' : ''}`}>
                    <LoopsyTopBar loopsyState={loopsyState} onAvatarClick={onLoopsyClick} />

                    {/* Dark mode toggle — left of home button */}

                                <line x1="12" y1="21" x2="12" y2="23"/>

                                <line x1="1"  y1="12" x2="3"  y2="12"/>

                                <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>

                    </button>

                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <DashboardBanner />
                    <div className="activities-stack">
                        {activities.map(activity => (
                            <ActivityTile
                                key={activity.id}
                                activity={activity}
                                onSelect={onSelectActivity}
                            />
                        ))}
                    </div>
                </div>
            );
        }
        
        // Activity: Draw — 3 brush sizes, soft-edge eraser, bottom toolbar
        function DrawActivity({ onHome }) {
            const canvasRef = useRef(null);
            const [isEraser, setIsEraser] = useState(false);
            const [brushSize, setBrushSize] = useState('medium'); // 'small'|'medium'|'large'

            // Paint radius = radial gradient reach; eraser radius = soft erase zone
            const BRUSH = {
                small:  { paint: 28,  erase: 18 },
                medium: { paint: 65,  erase: 40 },
                large:  { paint: 115, erase: 70 },
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.fillStyle = '#F6F3EE';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }, []);

            const handleTouch = (e) => {
                if (e.target.closest('.icon-button') || e.target.closest('.draw-toolbar')) return;
                haptic();
                if (e.type === 'touchstart' || e.type === 'mousedown') sounds.touch();

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
                const y = e.touches ? e.touches[0].clientY - rect.top  : e.clientY - rect.top;
                const cfg = BRUSH[brushSize];

                if (isEraser) {
                    // Soft-edge eraser: radial gradient of the background colour
                    const r = cfg.erase;
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0,    'rgba(246, 243, 238, 1)');
                    grad.addColorStop(0.55, 'rgba(246, 243, 238, 0.85)');
                    grad.addColorStop(1,    'rgba(246, 243, 238, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const hue = Math.random() * 80 + 200;
                    const sat = 50 + Math.random() * 20;
                    const lgt = 50 + Math.random() * 20;
                    const r = cfg.paint;
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
                    gradient.addColorStop(0,   `hsla(${hue}, ${sat}%, ${lgt}%, 0.38)`);
                    gradient.addColorStop(0.5, `hsla(${hue}, ${sat}%, ${lgt}%, 0.18)`);
                    gradient.addColorStop(1,   `hsla(${hue}, ${sat}%, ${lgt}%, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            const handleHomeClick = () => { haptic(); onHome(); };

            const pickBrush = (size) => { haptic(); setBrushSize(size); setIsEraser(false); };
            const toggleEraser = () => { haptic(); setIsEraser(e => !e); };

            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">

                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <canvas
                        ref={canvasRef}
                        onTouchStart={handleTouch}
                        onTouchMove={handleTouch}
                        onMouseDown={handleTouch}
                        onMouseMove={(e) => e.buttons === 1 && handleTouch(e)}
                    />

                    <div className="draw-toolbar" role="toolbar" aria-label="Drawing tools">
                        <button
                            className={`draw-tool-btn ${brushSize === 'small' && !isEraser ? 'active' : ''}`}
                            onClick={() => pickBrush('small')}
                            aria-label="Small brush" aria-pressed={brushSize === 'small' && !isEraser}
                        >
                            <div className="brush-dot" style={{ width: 8, height: 8 }} />
                        </button>
                        <button
                            className={`draw-tool-btn ${brushSize === 'medium' && !isEraser ? 'active' : ''}`}
                            onClick={() => pickBrush('medium')}
                            aria-label="Medium brush" aria-pressed={brushSize === 'medium' && !isEraser}
                        >
                            <div className="brush-dot" style={{ width: 14, height: 14 }} />
                        </button>
                        <button
                            className={`draw-tool-btn ${brushSize === 'large' && !isEraser ? 'active' : ''}`}
                            onClick={() => pickBrush('large')}
                            aria-label="Large brush" aria-pressed={brushSize === 'large' && !isEraser}
                        >
                            <div className="brush-dot" style={{ width: 21, height: 21 }} />
                        </button>
                        <div className="draw-divider" aria-hidden="true" />
                        <button
                            className={`draw-tool-btn ${isEraser ? 'active' : ''}`}
                            onClick={toggleEraser}
                            aria-label="Eraser" aria-pressed={isEraser}
                        >
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.6)" strokeWidth="1.8" aria-hidden="true">
                                <path d="M20 20H5.5L2 16.5 10.5 8l7 7-4.5 4.5"/>
                                <path d="M17.5 5.5l1 1-7 7-1-1"/>
                            </svg>
                        </button>
                    </div>
                </div>
            );
        }
        
        // Activity: Breath — 3s inhale / 3s hold / 3s exhale, ripples, warm soft circle
        function BreathActivity({ onHome }) {
            const [scale, setScale] = useState(1);
            const [count, setCount] = useState(1);
            const [phaseLabel, setPhaseLabel] = useState('Breathe in');
            const [ripples, setRipples] = useState([]);
            const rippleId = useRef(0);
            const phaseRef = useRef('in'); // 'in' | 'hold' | 'out'

            const INHALE_MS = 3000;
            const HOLD_MS   = 3000;
            const EXHALE_MS = 3000;
            const CYCLE_MS  = INHALE_MS + HOLD_MS + EXHALE_MS;

            useEffect(() => {
                const start = Date.now();

                const tick = () => {
                    const pos = (Date.now() - start) % CYCLE_MS;

                    let phase, t;
                    if (pos < INHALE_MS) {
                        phase = 'in';
                        t = pos / INHALE_MS;
                    } else if (pos < INHALE_MS + HOLD_MS) {
                        phase = 'hold';
                        t = (pos - INHALE_MS) / HOLD_MS;
                    } else {
                        phase = 'out';
                        t = (pos - INHALE_MS - HOLD_MS) / EXHALE_MS;
                    }

                    // Scale: expand on inhale, hold at peak, contract on exhale
                    const newScale =
                        phase === 'in'   ? 1 + t * 0.75 :
                        phase === 'hold' ? 1.75          :
                        1.75 - t * 0.75;

                    setScale(newScale);
                    setCount(Math.min(3, Math.floor(t * 3) + 1));

                    // Spawn ripple and update label on phase transition
                    const label = phase === 'in' ? 'Breathe in' : phase === 'hold' ? 'Hold' : 'Breathe out';
                    if (label !== phaseRef.current) {
                        phaseRef.current = label;
                        setPhaseLabel(label);
                        if (label === 'Breathe in') sounds.breatheIn();
                        else if (label === 'Hold')  sounds.hold();
