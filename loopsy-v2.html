<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Loopsy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
            background: #F6F3EE;
        }
        
        #root {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .icon-button {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            width: 44px;
            height: 44px;
            background: rgba(58, 58, 58, 0.07);
            border: none;
            border-radius: 22px;
            font-size: 20px;
            color: rgba(58, 58, 58, 0.5);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .icon-button:active {
            transform: scale(0.95);
            background: rgba(58, 58, 58, 0.13);
        }
        
        .home-button {
            right: 20px;
        }
        
        .tool-button {
            left: 20px;
        }
        
        .home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%);
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        
        .home-screen.fading-out {
            opacity: 0;
            transform: scale(0.95);
        }
        
        /* Loopsy float — used on sleeping image and character images */
        @keyframes loopsyFloat {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-9px); }
        }

        .loopsy-float {
            animation: loopsyFloat 5s ease-in-out infinite;
        }

        /* Home screen sleeping character */
        .loopsy-home-wrap {
            position: relative;
            display: inline-flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .loopsy-sleeping-img {
            width: 170px;
            height: auto;
            display: block;
        }

        /* Zzz speech bubble */
        .zzz-bubble {
            position: absolute;
            top: 4px;
            right: -34px;
            background: rgba(255, 255, 255, 0.78);
            border-radius: 14px 14px 14px 4px;
            padding: 5px 11px;
            font-size: 15px;
            font-weight: 500;
            color: rgba(58, 58, 58, 0.52);
            letter-spacing: 1.5px;
            pointer-events: none;
            animation: zzzPulse 5s ease-in-out infinite;
        }

        @keyframes zzzPulse {
            0%, 100% { opacity: 0.5; transform: translateY(0px); }
            50%       { opacity: 0.82; transform: translateY(-4px); }
        }

        /* Loopsy character image (stage 1–5 in overlays and top bar) */
        .loopsy-char-img {
            display: block;
            object-fit: contain;
        }

        /* Activity tile PNG icon */
        .tile-icon-img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            display: block;
        }

        /* ── Accessibility: text contrast & weights ── */
        .app-title {
            font-size: 42px;
            color: #5A5260;          /* contrast 4.6:1 on #F6F3EE — AA pass */
            font-weight: 500;
            letter-spacing: 3px;
            margin-bottom: 100px;
        }

        .swipe-hint {
            position: absolute;
            bottom: calc(50px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #6B6578;          /* contrast 4.5:1 on #F6F3EE — AA pass (large text) */
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            animation: fadeInOut 4s ease-in-out infinite;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.45; }
            50%       { opacity: 0.85; }
        }

        .swipe-icon {
            font-size: 22px;
            display: block;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .activities-screen {
            background: linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%);
            padding: calc(80px + env(safe-area-inset-top)) 25px calc(30px + env(safe-area-inset-bottom));
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        
        .activities-screen.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }
        
        .activities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .activity-card {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 110px;
        }
        
        .activity-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .activity-icon {
            width: 40px;
            height: 40px;
            opacity: 0.75;
            margin-bottom: 5px;
        }
        
        .activity-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        
        /* ── Soft Tile Stack (v2 dashboard) ── */

        .activities-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .activity-tile {
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(58, 58, 58, 0.07);
            border-radius: 18px;
            padding: 13px 16px 13px 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.14s ease, background 0.14s ease;
            -webkit-tap-highlight-color: transparent;
            text-align: left;
        }

        .activity-tile:active {
            transform: scale(0.983);
            background: rgba(255, 255, 255, 0.95);
        }

        .tile-icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--tile-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tile-label {
            flex: 1;
            font-size: 18px;
            font-weight: 500;   /* 4.5:1+ contrast on tile bg */
            color: #3A3A3A;
            letter-spacing: 0.1px;
        }

        .tile-chevron {
            color: rgba(58, 58, 58, 0.32);
            flex-shrink: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        .breathing-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(175, 155, 215, 0.3), rgba(200, 180, 240, 0.12));
            backdrop-filter: blur(5px);
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(58, 58, 58, 0.1);
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: inset -5px -5px 15px rgba(255, 255, 255, 0.55);
        }
        
        .bubble:active {
            transform: scale(0.7);
            opacity: 0;
        }
        
        .marble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.2),
                inset 10px 10px 20px rgba(255, 255, 255, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .lava-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            transition: none;
        }

        /* ── Loopsy character system ── */

        .loopsly-logo.sleeping .eye-wink {
            transform: scaleY(0.08);
            animation: none;
            transform-origin: center;
        }

        .loopsly-logo.sleeping {
            animation: sleepBreathe 5s ease-in-out infinite !important;
        }

        @keyframes sleepBreathe {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }

        .loopsy-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(64px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            display: flex;
            align-items: center;
            padding-left: 76px;
            padding-right: 76px;
            z-index: 10;
            pointer-events: none;
        }

        .loopsy-avatar-btn {
            position: absolute;
            left: 16px;
            top: calc(10px + env(safe-area-inset-top));
            width: 44px;
            height: 44px;
            background: rgba(58, 58, 58, 0.06);
            border: none;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            pointer-events: all;
        }

        .loopsy-avatar-btn:active {
            transform: scale(0.92);
            background: rgba(58, 58, 58, 0.12);
        }

        .loopsy-progress-track {
            flex: 1;
            height: 3px;
            background: rgba(58, 58, 58, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loopsy-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(155, 135, 195, 0.55), rgba(175, 155, 215, 0.75));
            border-radius: 2px;
            transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .character-screen-overlay {
            position: fixed;
            inset: 0;
            background: rgba(62, 52, 42, 0.88);
            backdrop-filter: blur(28px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .character-screen-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .character-close-btn {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            border-radius: 22px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .character-close-btn:active {
            transform: scale(0.92);
        }

        .speech-bubble {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 18px 28px;
            max-width: 260px;
            text-align: center;
            color: rgba(255, 248, 240, 0.82);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.3px;
            line-height: 1.55;
        }

        .character-float {
            animation: characterFloat 4.5s ease-in-out infinite;
        }

        @keyframes characterFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .exit-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 44px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: all;
        }

        .exit-overlay.visible {
            opacity: 1;
        }

        .exit-progress-track {
            width: 160px;
            height: 3px;
            background: rgba(58, 58, 58, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .exit-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(155, 135, 195, 0.6), rgba(175, 155, 215, 0.85));
            border-radius: 2px;
            transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loopsy-morph-wrap {
            transition: transform 0.9s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.6s ease;
        }

        /* ── Sensory safety: respect OS reduced-motion preference ── */
        @media (prefers-reduced-motion: reduce) {
            .loopsy-float,
            .loopsy-sleeping-img,
            .character-float,
            .zzz-bubble,
            .swipe-icon {
                animation: none !important;
            }
            .loopsy-progress-fill,
            .exit-progress-fill,
            .loopsy-morph-wrap {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        
        // Haptic Settings Context
        const HapticContext = createContext({ enabled: true, setEnabled: () => {} });
        
        // Single, consistent haptic helper - always 12ms, light impact
        const haptic = () => {
            // Check if haptics are enabled (could be toggled via settings in future)
            const hapticsEnabled = true; // Can be made dynamic via context
            
            if (!hapticsEnabled) return;
            
            if (navigator.vibrate) {
                // Android/web - consistent 12ms vibration
                navigator.vibrate(12);
            } else if (window.webkit?.messageHandlers?.haptic) {
                // iOS if using native wrapper - use light impact
                window.webkit.messageHandlers.haptic.postMessage({ style: 'light' });
            }
        };
        
        // Loopsy sleeping — home screen only
        function LoopsySleeping() {
            return (
                <div className="loopsy-home-wrap">
                    <img
                        src="assets/loopsy/loopsy-sleeping.png"
                        alt=""
                        aria-hidden="true"
                        className="loopsy-sleeping-img loopsy-float"
                    />
                    <div className="zzz-bubble" aria-hidden="true">Zzz…</div>
                </div>
            );
        }
        
        // Home Screen
        function HomeScreen({ onSwipeUp, isVisible }) {
            const [touchStart, setTouchStart] = useState(0);
            
            const handleTouchStart = (e) => {
                setTouchStart(e.touches[0].clientY);
                haptic();
            };
            
            const handleTouchEnd = (e) => {
                const touchEnd = e.changedTouches[0].clientY;
                const diff = touchStart - touchEnd;
                
                if (diff > 50) {
                    haptic();
                    onSwipeUp();
                }
            };
            
            return (
                <div 
                    className={`screen home-screen ${!isVisible ? 'fading-out' : ''}`}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                    style={{ pointerEvents: isVisible ? 'all' : 'none' }}
                >
                    <LoopsySleeping />
                    <div className="app-title">loopsly</div>
                    <div className="swipe-hint">
                        <span className="swipe-icon">↑</span>
                        swipe up
                    </div>
                </div>
            );
        }
        
        // Icon components
        const DrawIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.55)" strokeWidth="1.5">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                <path d="M2 2l7.586 7.586"/>
                <circle cx="11" cy="11" r="2"/>
            </svg>
        );
        
        const BreathIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.55)" strokeWidth="1.5">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6" opacity="0.5"/>
                <circle cx="12" cy="12" r="2" opacity="0.3"/>
            </svg>
        );
        
        const FloatIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.55)" strokeWidth="1.5">
                <circle cx="12" cy="12" r="3"/>
                <circle cx="18" cy="7" r="2" opacity="0.7"/>
                <circle cx="6" cy="16" r="2.5" opacity="0.8"/>
                <circle cx="16" cy="18" r="1.5" opacity="0.6"/>
            </svg>
        );
        
        const ShiftIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.55)" strokeWidth="1.5">
                <path d="M12 2L2 7l10 5 10-5-10-5z" opacity="0.8"/>
                <path d="M2 17l10 5 10-5" opacity="0.6"/>
                <path d="M2 12l10 5 10-5" opacity="0.4"/>
            </svg>
        );
        
        const TapIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.55)" strokeWidth="1.5">
                <circle cx="12" cy="5" r="2"/>
                <circle cx="5" cy="12" r="2"/>
                <circle cx="19" cy="12" r="2"/>
                <circle cx="8" cy="18" r="2"/>
                <circle cx="16" cy="18" r="2"/>
            </svg>
        );
        
        const FlowIcon = () => (
            <svg className="activity-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(58,58,58,0.55)" strokeWidth="1.5">
                <ellipse cx="12" cy="8" rx="8" ry="4" opacity="0.7"/>
                <ellipse cx="12" cy="16" rx="6" ry="3" opacity="0.5"/>
                <ellipse cx="12" cy="12" rx="7" ry="3.5" opacity="0.6"/>
            </svg>
        );
        
        // Single activity tile — uses PNG icon assets
        function ActivityTile({ activity, onSelect }) {
            const handleClick = () => {
                haptic();
                onSelect(activity.id);
            };

            return (
                <button
                    className="activity-tile"
                    style={{ '--tile-tint': activity.tint }}
                    onClick={handleClick}
                    aria-label={activity.label}
                >
                    <div className="tile-icon-wrap">
                        <img
                            src={`assets/icons/${activity.icon}`}
                            alt=""
                            aria-hidden="true"
                            className="tile-icon-img"
                        />
                    </div>
                    <span className="tile-label">{activity.label}</span>
                    <svg className="tile-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            );
        }

        // Activities Dashboard — Soft Tile Stack
        function ActivitiesScreen({ onSelectActivity, onHome, isVisible, loopsyState, onLoopsyClick }) {
            // icon: filename under assets/icons/
            const activities = [
                { id: 'draw',   icon: 'draw.png',    label: 'Draw',    tint: '#EDE7F6' },
                { id: 'breath', icon: 'breathe.png',  label: 'Breathe', tint: '#E3EFF7' },
                { id: 'float',  icon: 'float.png',   label: 'Float',   tint: '#E8F5ED' },
                { id: 'shift',  icon: 'shift.png',   label: 'Shift',   tint: '#FEF3E2' },
                { id: 'tap',    icon: 'tap.png',     label: 'Tap',     tint: '#F3E8E6' },
                { id: 'flow',   icon: 'flow.png',    label: 'Flow',    tint: '#EEE8F7' },
            ];

            const handleHomeClick = () => {
                haptic();
                onHome();
            };

            return (
                <div className={`screen activities-screen ${isVisible ? 'visible' : ''}`}>
                    <LoopsyTopBar loopsyState={loopsyState} onAvatarClick={onLoopsyClick} />
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <div className="activities-stack">
                        {activities.map(activity => (
                            <ActivityTile
                                key={activity.id}
                                activity={activity}
                                onSelect={onSelectActivity}
                            />
                        ))}
                    </div>
                </div>
            );
        }
        
        // Activity: Draw
        function DrawActivity({ onHome }) {
            const canvasRef = useRef(null);
            const [isEraser, setIsEraser] = useState(false);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                ctx.fillStyle = '#F6F3EE';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }, []);

            const handleTouch = (e) => {
                if (e.target.closest('.icon-button')) return;
                haptic();

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
                const y = e.touches ? e.touches[0].clientY - rect.top : e.clientY - rect.top;

                if (isEraser) {
                    ctx.fillStyle = '#F6F3EE';
                    ctx.beginPath();
                    ctx.arc(x, y, 30, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const hue = Math.random() * 80 + 200;
                    const saturation = 50 + Math.random() * 20;
                    const lightness = 50 + Math.random() * 20;
                    
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, 60);
                    gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, 0.35)`);
                    gradient.addColorStop(0.5, `hsla(${hue}, ${saturation}%, ${lightness}%, 0.18)`);
                    gradient.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness}%, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };
            
            const toggleTool = () => {
                haptic();
                setIsEraser(!isEraser);
            };
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)' }}>
                    <button className="icon-button tool-button" onClick={toggleTool}>
                        {isEraser ? (
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            </svg>
                        ) : (
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M20 20H5.5L2 16.5 10.5 8l3 3L20 4"/>
                                <path d="M13.5 11l3-3"/>
                            </svg>
                        )}
                    </button>
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <canvas 
                        ref={canvasRef}
                        onTouchStart={handleTouch}
                        onTouchMove={handleTouch}
                        onMouseDown={handleTouch}
                        onMouseMove={(e) => e.buttons === 1 && handleTouch(e)}
                    />
                </div>
            );
        }
        
        // Activity: Breath
        function BreathActivity({ onHome }) {
            const [scale, setScale] = useState(1);
            
            useEffect(() => {
                let growing = true;
                const interval = setInterval(() => {
                    setScale(prev => {
                        if (prev >= 1.7) growing = false;
                        if (prev <= 1) growing = true;
                        return growing ? prev + 0.006 : prev - 0.006;
                    });
                }, 30);
                
                return () => clearInterval(interval);
            }, []);
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <div 
                        className="breathing-circle"
                        style={{ 
                            transform: `translate(-50%, -50%) scale(${scale})`,
                            transition: 'transform 0.03s linear'
                        }}
                    />
                </div>
            );
        }
        
        // Activity: Float
        function FloatActivity({ onHome }) {
            const [bubbles, setBubbles] = useState([]);
            const nextId = useRef(0);
            
            const pastelColors = [
                'radial-gradient(circle at 30% 30%, rgba(255, 200, 220, 0.4), rgba(255, 180, 210, 0.2))',
                'radial-gradient(circle at 30% 30%, rgba(200, 220, 255, 0.4), rgba(180, 210, 255, 0.2))',
                'radial-gradient(circle at 30% 30%, rgba(220, 255, 200, 0.4), rgba(210, 255, 180, 0.2))',
                'radial-gradient(circle at 30% 30%, rgba(255, 240, 200, 0.4), rgba(255, 230, 180, 0.2))',
                'radial-gradient(circle at 30% 30%, rgba(240, 200, 255, 0.4), rgba(230, 180, 255, 0.2))',
                'radial-gradient(circle at 30% 30%, rgba(200, 255, 240, 0.4), rgba(180, 255, 230, 0.2))'
            ];
            
            useEffect(() => {
                const createBubble = () => {
                    const size = 40 + Math.random() * 60;
                    const newBubble = {
                        id: nextId.current++,
                        x: Math.random() * (window.innerWidth - size),
                        y: window.innerHeight + size,
                        size: size,
                        speed: 1.2 + Math.random() * 1.5,
                        drift: (Math.random() - 0.5) * 0.5,
                        color: pastelColors[Math.floor(Math.random() * pastelColors.length)]
                    };
                    setBubbles(prev => [...prev, newBubble]);
                };
                
                for (let i = 0; i < 10; i++) {
                    setTimeout(createBubble, i * 400);
                }
                
                const bubbleInterval = setInterval(createBubble, 1200);
                
                const moveInterval = setInterval(() => {
                    setBubbles(prev => 
                        prev
                            .map(bubble => ({
                                ...bubble,
                                y: bubble.y - bubble.speed,
                                x: bubble.x + bubble.drift
                            }))
                            .filter(bubble => bubble.y > -bubble.size)
                    );
                }, 16);
                
                return () => {
                    clearInterval(bubbleInterval);
                    clearInterval(moveInterval);
                };
            }, []);
            
            const popBubble = (id) => {
                haptic();
                setBubbles(prev => prev.filter(b => b.id !== id));
            };
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)', overflow: 'hidden' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    {bubbles.map(bubble => (
                        <div
                            key={bubble.id}
                            className="bubble"
                            onClick={() => popBubble(bubble.id)}
                            style={{
                                left: `${bubble.x}px`,
                                top: `${bubble.y}px`,
                                width: `${bubble.size}px`,
                                height: `${bubble.size}px`,
                                background: bubble.color
                            }}
                        />
                    ))}
                </div>
            );
        }
        
        // Activity: Shift
        function ShiftActivity({ onHome }) {
            const canvasRef = useRef(null);
            const particles = useRef([]);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                for (let i = 0; i < 800; i++) {
                    particles.current.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: 0,
                        vy: 0,
                        hue: 200 + Math.random() * 60
                    });
                }
                
                function animate() {
                    ctx.fillStyle = 'rgba(246, 243, 238, 0.18)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    particles.current.forEach(p => {
                        p.vx *= 0.95;
                        p.vy *= 0.95;
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;

                        ctx.fillStyle = `hsla(${p.hue}, 38%, 42%, 0.72)`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    
                    requestAnimationFrame(animate);
                }
                
                animate();
            }, []);
            
            const handleTouch = (e) => {
                if (e.target.closest('.icon-button')) return;
                haptic();
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
                const y = e.touches ? e.touches[0].clientY - rect.top : e.clientY - rect.top;
                
                particles.current.forEach(p => {
                    const dx = p.x - x;
                    const dy = p.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const force = (100 - dist) / 100;
                        p.vx += dx / dist * force * 3;
                        p.vy += dy / dist * force * 3;
                    }
                });
            };
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    <canvas 
                        ref={canvasRef}
                        onTouchStart={handleTouch}
                        onTouchMove={handleTouch}
                        onMouseDown={handleTouch}
                        onMouseMove={(e) => e.buttons === 1 && handleTouch(e)}
                    />
                </div>
            );
        }
        
        // Activity: Tap
        function TapActivity({ onHome }) {
            const [marbles, setMarbles] = useState([]);
            const nextId = useRef(0);
            
            const marbleColors = [
                'radial-gradient(circle at 30% 30%, #FFB3D9, #FF80BF)',
                'radial-gradient(circle at 30% 30%, #B3D9FF, #80BFFF)',
                'radial-gradient(circle at 30% 30%, #D9FFB3, #BFFF80)',
                'radial-gradient(circle at 30% 30%, #FFE5B3, #FFD280)',
                'radial-gradient(circle at 30% 30%, #E5B3FF, #D280FF)',
                'radial-gradient(circle at 30% 30%, #B3FFE5, #80FFD2)',
                'radial-gradient(circle at 30% 30%, #FFB3B3, #FF8080)',
                'radial-gradient(circle at 30% 30%, #B3E5FF, #80D2FF)'
            ];
            
            const handleTouch = (e) => {
                if (e.target.closest('.icon-button')) return;
                haptic();
                
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.touches ? e.touches[0].clientX - rect.left : e.clientX - rect.left;
                const y = e.touches ? e.touches[0].clientY - rect.top : e.clientY - rect.top;
                
                const size = 30 + Math.random() * 30;
                const newMarble = {
                    id: nextId.current++,
                    x: x - size / 2,
                    y: y - size / 2,
                    size: size,
                    color: marbleColors[Math.floor(Math.random() * marbleColors.length)]
                };
                
                setMarbles(prev => [...prev, newMarble]);
            };
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div 
                    className="screen" 
                    style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)', overflow: 'hidden' }}
                    onClick={handleTouch}
                    onTouchStart={handleTouch}
                >
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    {marbles.map(marble => (
                        <div
                            key={marble.id}
                            className="marble"
                            style={{
                                left: `${marble.x}px`,
                                top: `${marble.y}px`,
                                width: `${marble.size}px`,
                                height: `${marble.size}px`,
                                background: marble.color
                            }}
                        />
                    ))}
                </div>
            );
        }
        
        // Activity: Flow (Lava Lamp with Gyroscope)
        function FlowActivity({ onHome }) {
            const [blobs, setBlobs] = useState([]);
            const gyroData = useRef({ beta: 0, gamma: 0 });
            const smoothedGyro = useRef({ beta: 0, gamma: 0 });
            
            useEffect(() => {
                // Initialize blobs
                const initialBlobs = [
                    { id: 1, x: 30, y: 40, vx: 0, vy: 0, size: 180, color: 'rgba(190, 155, 230, 0.38)' },
                    { id: 2, x: 60, y: 70, vx: 0, vy: 0, size: 220, color: 'rgba(155, 195, 230, 0.38)' },
                    { id: 3, x: 20, y: 20, vx: 0, vy: 0, size: 160, color: 'rgba(240, 175, 190, 0.38)' },
                    { id: 4, x: 70, y: 50, vx: 0, vy: 0, size: 200, color: 'rgba(165, 220, 200, 0.38)' }
                ];
                setBlobs(initialBlobs);
                
                // Request device orientation permission (iOS 13+)
                const requestPermission = async () => {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        try {
                            const permission = await DeviceOrientationEvent.requestPermission();
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        } catch (error) {
                            console.log('Device orientation not available');
                        }
                    } else {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                };
                
                const handleOrientation = (event) => {
                    gyroData.current = {
                        beta: event.beta || 0,   // front-back tilt (-180 to 180)
                        gamma: event.gamma || 0  // left-right tilt (-90 to 90)
                    };
                };
                
                requestPermission();
                
                // Animation loop
                const interval = setInterval(() => {
                    // Smooth gyroscope data (remove jitter)
                    smoothedGyro.current.beta += (gyroData.current.beta - smoothedGyro.current.beta) * 0.05;
                    smoothedGyro.current.gamma += (gyroData.current.gamma - smoothedGyro.current.gamma) * 0.05;
                    
                    // Convert tilt to gentle force (very small multiplier for slow movement)
                    const forceX = smoothedGyro.current.gamma * 0.002;
                    const forceY = smoothedGyro.current.beta * 0.002;
                    
                    setBlobs(prev => prev.map(blob => {
                        // Apply force from gyroscope
                        let newVx = blob.vx + forceX;
                        let newVy = blob.vy + forceY;
                        
                        // Heavy damping (like honey)
                        newVx *= 0.92;
                        newVy *= 0.92;
                        
                        // Update position
                        let newX = blob.x + newVx;
                        let newY = blob.y + newVy;
                        
                        // Soft boundaries (bounce gently)
                        if (newX < 5) {
                            newX = 5;
                            newVx *= -0.3;
                        }
                        if (newX > 95) {
                            newX = 95;
                            newVx *= -0.3;
                        }
                        if (newY < 5) {
                            newY = 5;
                            newVy *= -0.3;
                        }
                        if (newY > 95) {
                            newY = 95;
                            newVy *= -0.3;
                        }
                        
                        return {
                            ...blob,
                            x: newX,
                            y: newY,
                            vx: newVx,
                            vy: newVy
                        };
                    }));
                }, 50); // 20fps for smooth but not too fast movement
                
                return () => {
                    clearInterval(interval);
                    window.removeEventListener('deviceorientation', handleOrientation);
                };
            }, []);
            
            const handleHomeClick = () => {
                haptic();
                onHome();
            };
            
            return (
                <div className="screen" style={{ background: 'linear-gradient(180deg, #F6F3EE 0%, #EDE8E0 100%)', overflow: 'hidden' }}>
                    <button className="icon-button home-button" onClick={handleHomeClick} aria-label="Go back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </button>
                    {blobs.map(blob => (
                        <div
                            key={blob.id}
                            className="lava-blob"
                            style={{
                                left: `${blob.x}%`,
                                top: `${blob.y}%`,
                                width: `${blob.size}px`,
                                height: `${blob.size}px`,
                                background: blob.color,
                                transform: 'translate(-50%, -50%)'
                            }}
                        />
                    ))}
                </div>
            );
        }
        
        // ── Loopsy character system ──

        const LOOPSY_PHRASES = [
            "you're okay here",
            "we can stay a while",
            "nothing needed",
            "just being is enough",
            "this is a gentle place",
            "no rush at all",
            "you belong here",
            "soft and still",
            "breathe easy",
            "all is well here",
            "there's nowhere to be",
            "rest here a moment"
        ];

        // Stage images: stage 0 → loopsy-1.png … stage 4 → loopsy-5.png
        const LOOPSY_STAGE_SRCS = [
            'assets/loopsy/loopsy-1.png',
            'assets/loopsy/loopsy-2.png',
            'assets/loopsy/loopsy-3.png',
            'assets/loopsy/loopsy-4.png',
            'assets/loopsy/loopsy-5.png',
        ];

        function LoopsyCharacterImg({ stage = 0, size = 100, float = false }) {
            return (
                <img
                    src={LOOPSY_STAGE_SRCS[Math.min(stage, 4)]}
                    alt=""
                    aria-hidden="true"
                    className={`loopsy-char-img${float ? ' loopsy-float' : ''}`}
                    width={size}
                    height={size}
                />
            );
        }

        function stageFromCount(n) { return Math.min(4, Math.floor(n / 2)); }
        function progressFromCount(n) { return Math.min(1, n / 8); }

        function LoopsyTopBar({ loopsyState, onAvatarClick }) {
            const progress = progressFromCount(loopsyState.activityCount);
            return (
                <div className="loopsy-top-bar">
                    <button className="loopsy-avatar-btn" onClick={onAvatarClick}>
                        <LoopsyCharacterImg stage={loopsyState.stage} size={30} />
                    </button>
                    <div className="loopsy-progress-track">
                        <div className="loopsy-progress-fill" style={{ width: `${progress * 100}%` }} />
                    </div>
                </div>
            );
        }

        function CharacterScreen({ loopsyState, onClose }) {
            const [visible, setVisible] = useState(false);
            const [phrase] = useState(
                () => LOOPSY_PHRASES[Math.floor(Math.random() * LOOPSY_PHRASES.length)]
            );

            useEffect(() => { requestAnimationFrame(() => setVisible(true)); }, []);

            const handleClose = () => {
                haptic();
                setVisible(false);
                setTimeout(onClose, 400);
            };

            return (
                <div className={`character-screen-overlay ${visible ? 'visible' : ''}`}>
                    <button className="character-close-btn" onClick={handleClose}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                    <div className="character-float">
                        <LoopsyCharacterImg stage={loopsyState.stage} size={160} float={false} />
                    </div>
                    <div className="speech-bubble">{phrase}</div>
                </div>
            );
        }

        function ExitOverlay({ loopsyState, pendingState, onComplete }) {
            const [visible, setVisible] = useState(false);
            const [fillWidth, setFillWidth] = useState(progressFromCount(loopsyState.activityCount) * 100);
            const [showNext, setShowNext] = useState(false);
            const stageChanged = pendingState.stage > loopsyState.stage;

            useEffect(() => {
                requestAnimationFrame(() => setVisible(true));

                const t1 = setTimeout(() => {
                    setFillWidth(progressFromCount(pendingState.activityCount) * 100);
                }, 350);

                const t2 = stageChanged ? setTimeout(() => setShowNext(true), 1000) : null;

                const totalDuration = stageChanged ? 2200 : 1700;
                const t3 = setTimeout(() => {
                    setVisible(false);
                    setTimeout(onComplete, 420);
                }, totalDuration);

                return () => { clearTimeout(t1); if (t2) clearTimeout(t2); clearTimeout(t3); };
            }, []);

            const displayStage = showNext ? pendingState.stage : loopsyState.stage;

            return (
                <div className={`exit-overlay ${visible ? 'visible' : ''}`}>
                    <div className="loopsy-morph-wrap" style={{
                        transform: showNext ? 'scale(1.1)' : 'scale(1)',
                        opacity: 1
                    }}>
                        <LoopsyCharacterImg stage={displayStage} size={140} float={false} />
                    </div>
                    <div className="exit-progress-track">
                        <div className="exit-progress-fill" style={{ width: `${fillWidth}%` }} />
                    </div>
                </div>
            );
        }

        // Main App
        function App() {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [showActivities, setShowActivities] = useState(false);
            const [showHome, setShowHome] = useState(true);
            const [currentActivity, setCurrentActivity] = useState(null);
            const [loopsyState, setLoopsyState] = useState({ stage: 0, activityCount: 0 });
            const [pendingLoopsyState, setPendingLoopsyState] = useState(null);
            const [showExitOverlay, setShowExitOverlay] = useState(false);
            const [showCharacterScreen, setShowCharacterScreen] = useState(false);

            const handleSwipeUp = () => {
                setShowHome(false);
                setTimeout(() => {
                    setShowActivities(true);
                    setCurrentScreen('activities');
                }, 600);
            };

            const handleHome = () => {
                if (currentActivity) {
                    const newCount = loopsyState.activityCount + 1;
                    const newStage = stageFromCount(newCount);
                    setPendingLoopsyState({ stage: newStage, activityCount: newCount });
                    setShowExitOverlay(true);
                } else if (currentScreen === 'activities') {
                    setShowActivities(false);
                    setTimeout(() => {
                        setShowHome(true);
                        setCurrentScreen('home');
                    }, 600);
                }
            };

            const handleExitComplete = () => {
                setLoopsyState(pendingLoopsyState);
                setCurrentActivity(null);
                setShowExitOverlay(false);
                setPendingLoopsyState(null);
            };

            const activities = {
                draw: <DrawActivity onHome={handleHome} />,
                breath: <BreathActivity onHome={handleHome} />,
                float: <FloatActivity onHome={handleHome} />,
                shift: <ShiftActivity onHome={handleHome} />,
                tap: <TapActivity onHome={handleHome} />,
                flow: <FlowActivity onHome={handleHome} />
            };

            return (
                <div id="app">
                    {showExitOverlay && pendingLoopsyState && (
                        <ExitOverlay
                            loopsyState={loopsyState}
                            pendingState={pendingLoopsyState}
                            onComplete={handleExitComplete}
                        />
                    )}
                    {showCharacterScreen && (
                        <CharacterScreen
                            loopsyState={loopsyState}
                            onClose={() => setShowCharacterScreen(false)}
                        />
                    )}
                    {currentActivity ? (
                        activities[currentActivity]
                    ) : (
                        <>
                            <HomeScreen onSwipeUp={handleSwipeUp} isVisible={showHome} />
                            <ActivitiesScreen
                                onSelectActivity={setCurrentActivity}
                                onHome={handleHome}
                                isVisible={showActivities}
                                loopsyState={loopsyState}
                                onLoopsyClick={() => { haptic(); setShowCharacterScreen(true); }}
                            />
                        </>
                    )}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
